found: 3
notes: >-
  Round 1 (2026-07-19) probed only the Wix marketing host www.meetleo.com, which
  returns HTTP 400 for every /.well-known/ path, and recorded a clean negative.
  Re-probing on 2026-08-14 against the API and MCP hosts found three real
  documents on https://mcp.meetleo.com -- an RFC 9728 OAuth protected-resource
  document, an RFC 8414 authorization-server metadata document, and the same
  metadata served at /.well-known/openid-configuration. All three are anonymous,
  return application/json, and name LeO's own Cognito-backed authorization server
  at https://insights-app-auth.meetleo.com. This is a REAL hit, so a WellKnown
  pointer is wired in apis.yml. No security.txt is served on any host, so no
  SecurityTxt pointer is emitted. insights-app.meetleo.com is a single-page
  application that answers HTTP 200 with an HTML shell for every path including
  /.well-known/* -- those 200s are NOT documents and are recorded as misses.
