openapi: 3.2.0
info:
  title: Leo Public Credits API
  description: External API for account management, credits, prospect search, and contact enrichment
  version: '1.0'
  contact: {}
servers: []
tags:
- name: Credits
paths:
  /v1/credits/balance:
    get:
      operationId: CreditsController_getCreditBalance
      summary: Get credit balance
      description: Returns the available and reserved credits for the authenticated user, including whether credits are individual or pool-based.
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditBalanceResponseDto'
        '401':
          description: Unauthorized
      tags:
      - Credits
      security:
      - bearer: []
components:
  schemas:
    CreditBalanceResponseDto:
      type: object
      properties:
        available:
          type: number
          example: 100
        reserved:
          type: number
          example: 5
        plan:
          type: string
          enum:
          - individual
          - pool
          example: individual
        poolId:
          type: string
          example: pool-abc
      required:
      - available
      - reserved
      - plan
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
