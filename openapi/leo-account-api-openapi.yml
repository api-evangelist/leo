openapi: 3.2.0
info:
  title: Leo Public Account API
  description: External API for account management, credits, prospect search, and contact enrichment
  version: '1.0'
  contact: {}
servers: []
tags:
- name: Account
paths:
  /v1/account:
    get:
      operationId: AccountController_getAccount
      summary: Get account info
      description: Returns the authenticated user identity and plan entitlements. Plan data is cached for 60 seconds.
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponseDto'
        '401':
          description: Unauthorized
      tags:
      - Account
      security:
      - bearer: []
components:
  schemas:
    PlanDto:
      type: object
      properties:
        name:
          type: string
          example: Pro
        hasApiAccess:
          type: boolean
          example: true
        hasMcpAccess:
          type: boolean
          example: true
      required:
      - name
      - hasApiAccess
      - hasMcpAccess
    AccountResponseDto:
      type: object
      properties:
        userId:
          type: string
          example: abc123-def456
        email:
          type: string
          example: user@example.com
        tenantId:
          type: string
          example: tenant-abc
        plan:
          $ref: '#/components/schemas/PlanDto'
      required:
      - userId
      - email
      - tenantId
      - plan
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
