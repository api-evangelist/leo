          - number
          - 'null'
          example: 11820000
          description: Total expenses in USD.
        totalNetAssets:
          type:
          - number
          - 'null'
          example: 3650000
          description: Total net assets at fiscal year end, in USD.
        history:
          description: Up to 11 years of historical IRS total expenses, descending by year. Only present when the requesting user has the csvHasIrsHistoricalData entitlement.
          type: array
          items:
            $ref: '#/components/schemas/ProspectIrs990HistoryEntry'
      required:
      - reportType
      - reportYear
      - totalRevenue
      - totalExpenses
      - totalNetAssets
    InsuranceLineData:
      type: object
      properties:
        renewalDate:
          type:
          - string
          - 'null'
          example: '2026-09-01'
          description: Policy renewal date (ISO YYYY-MM-DD). Present for WC, pension, and welfare/benefits lines.
        carrier:
          type:
          - string
          - 'null'
          example: Travelers
          description: Insurance carrier name for this line.
        broker:
          type:
          - string
          - 'null'
          example: Marsh McLennan Agency
          description: Broker name. Present for WC, pension, and welfare/benefits lines.
        participants:
          type:
          - number
          - 'null'
          example: 142
          description: Number of covered participants. Only present for pension and welfare/benefits lines.
      required:
      - renewalDate
      - carrier
    SearchProspectsDto:
      type: object
      properties:
        filters:
          description: Filter group(s). Within a single object, conditions are **ANDed** together. Pass one object for a typical search — multiple objects are reserved for advanced segment combinations.
          example:
          - state:
            - TX
            naicsList:
            - '484110'
            - '484121'
            minEmployeesNumber: 25
            maxEmployeesNumber: 250
            hasWc: true
            hasDot: true
          type: array
          items:
            $ref: '#/components/schemas/SearchProspectsFiltersDto'
        page:
          type: integer
          description: 1-based page number
          example: 1
          minimum: 1
        limit:
          type: integer
          description: Results per page
          example: 25
          minimum: 1
          maximum: 100
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
