generated: '2026-08-14'
method: probed
source: >-
  https://www.meetleo.com/mcp (301 -> https://content.meetleo.com/mcp.html);
  live JSON-RPC probe of https://mcp.meetleo.com/mcp;
  https://mcp.meetleo.com/.well-known/oauth-protected-resource
status: published
first_party: true
notes: >-
  LeO ships a first-party, hosted, remote MCP server -- the "LeO MCP Connector" --
  at https://mcp.meetleo.com/mcp. It is marketed from the primary navigation of
  meetleo.com and labelled "MCP Connector - Live". This supersedes the round-1
  finding that LeO "publishes no first-party product API or MCP server"; that
  conclusion was drawn from probing only the Wix marketing host. The Wix Site MCP
  recorded previously is a different, platform-provided server and is now kept
  separately in mcp/leo-site-mcp.yml.
  The live tools/list is OAuth-gated: an anonymous JSON-RPC call returns HTTP 401
  with a WWW-Authenticate header naming RFC 9728 resource metadata, so real tool
  inputSchemas could NOT be read and are NOT reproduced here. The tool names below
  come from LeO's own published workflow illustration on the connector page and are
  attributed with explicit confidence; they are not invented and not treated as a
  verified tool list.
deployment:
  mode: remote
  endpoint: https://mcp.meetleo.com/mcp
  install: null
  package: null
  auth: oauth
  verified: probed
server:
  name: LeO MCP Connector
  transport: http
  url: https://mcp.meetleo.com/mcp
  vendor: LeO
  vendor_docs: https://www.meetleo.com/mcp
  first_party: true
  authentication: oauth2 (authorization_code + PKCE S256)
  scope: LeO product data - prospect search, prospect enrichment, account/entitlements
  tenancy: >-
    "The connector authenticates against your existing tenant and respects your
    entitlements and credit balance." (https://www.meetleo.com/mcp)
  account_required: true
  dynamic_client_registration: false
verified:
  date: '2026-08-14'
  initialize:
    status: 401
    body: >-
      {"jsonrpc":"2.0","error":{"code":-32001,"message":"Authentication required.
      Provide a token via the Authorization header."},"id":null}
    www_authenticate: >-
      Bearer resource_metadata="https://mcp.meetleo.com/.well-known/oauth-protected-resource"
  tools_list:
    status: 401
    note: Same challenge. Tool schemas require an authenticated introspection.
  health:
    url: https://mcp.meetleo.com/health
    status: 200
    body: '{"status":"ok"}'
  discovery:
  - url: https://mcp.meetleo.com/.well-known/oauth-protected-resource
    status: 200
  - url: https://mcp.meetleo.com/.well-known/oauth-authorization-server
    status: 200
  - url: https://mcp.meetleo.com/.well-known/openid-configuration
    status: 200
  - url: https://mcp.meetleo.com/register
    status: 404
    note: No RFC 7591 dynamic client registration.
