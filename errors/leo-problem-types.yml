statuses:
- status: 401
  title: Unauthorized
  declared_on:
  - AccountController_getAccount
  - CreditsController_getCreditBalance
  - ProspectsController_search
  - ProspectsController_getById
  - ProspectsController_enrich
  - JobsController_getJob
  remediation: >-
    Present a valid JWT in the Authorization header. Verify the account's plan
    carries hasApiAccess (GET /v1/account).
  method: derived
- status: 402
  title: Insufficient credits
  declared_on:
  - ProspectsController_getById
  - ProspectsController_enrich
  remediation: >-
    Check GET /v1/credits/balance for available vs reserved credits. Enrichment
    reserves credits up to maxProspects before the job runs; a single prospect
    fetch costs 1 credit.
  method: derived
- status: 404
  title: Not found
  declared_on:
  - ProspectsController_getById
  - JobsController_getJob
  detail: >-
    "Prospect not found" on GET /v1/prospects/{prospectId}; "Job not found or
    expired" on GET /v1/jobs/{taskId}.
  remediation: >-
    Jobs expire. Poll GET /v1/jobs/{taskId} within the documented five-minute
    window rather than retrieving results later.
  method: derived
- status: 422
  title: Validation error
  declared_on:
  - ProspectsController_search
  - ProspectsController_enrich
  detail: >-
    "Validation error" on search; "No prospects match filters" on enrich -- the
    same status carries two distinct meanings.
  remediation: >-
    On enrich, a 422 usually means the filter set matched zero prospects. Preview
    the same filter shape with POST /v1/prospects/search first, which does not
    consume enrichment credits.
  method: derived
- status: 429
  title: Too many requests
  declared_on:
  - ProspectsController_search
  - ProspectsController_getById
  - ProspectsController_enrich
  - JobsController_getJob
  detail: >-
    Declared verbatim in the spec as "Too many requests (HTTP API stage throttling
    or upstream limits)".
  remediation: >-
    Back off and retry. No numeric limit, window or RateLimit/Retry-After header is
    published; see rate-limits/leo-rate-limits.yml.
  method: derived
- status: 202
  title: Accepted (not an error)
  declared_on:
  - ProspectsController_enrich
  detail: >-
    Recorded here because it changes the client contract: enrichment is
    asynchronous and returns taskId, pollUrl, creditsReserved and
    estimatedWaitSeconds instead of results.
  method: derived
job_level_errors:
  note: >-
    A job can complete at the HTTP level and still fail per prospect. Inspect
    data.status (pending / processing / completed / failed) and, within a completed
    job, each prospect's enrichmentStatus.
  enrichment_status_values:
  - value: enriched
    meaning: Email and title returned; a credit was charged.
  - value: no_email
    meaning: Prospect matched but no contact was found; no credit charged.
  - value: failed
    meaning: This prospect errored.
  source: openapi/leo-jobs-api-openapi.yml
