notes: >-
  Derived from the response codes declared on every operation in LeO's published
  OpenAPI, plus the error envelope observed on a live unauthenticated request to
  https://api.meetleo.com/v1/openapi.json (a 404 that returned the full envelope).
  LeO does NOT use RFC 9457 application/problem+json. It uses a custom JSON
  envelope in which errors are carried in an `errors[]` array alongside `data`,
  `version`, `processTime` and `metadata`. The envelope is declared in the spec as
  JobPollEnvelopeDto and JobErrorItemDto and was confirmed live. LeO publishes no
  prose error reference page, so the remediation text below is derived from the
  operation descriptions in the spec and is marked as such.
format: custom-envelope
problem_json: false
rfc9457: false
envelope:
  shape: |
    {
      "version": "1.0",
      "processTime": 0,
      "data": null,
      "errors": [{"code": "NOT_FOUND", "message": "Cannot GET /v1/openapi.json"}],
      "metadata": {
        "requestId": "78a64aba-3d1c-4908-86ac-6574368e0a60",
        "creditsUsed": 0,
        "creditsRemaining": 0
      }
    }
  fields:
  - name: errors
    type: array
    item_schema: JobErrorItemDto
    description: Zero or more {code, message} pairs. Empty array on success.
  - name: errors[].code
    type: string
    description: Machine-readable error code, e.g. NOT_FOUND.
  - name: errors[].message
    type: string
    description: Human-readable message.
  - name: data
    type: object|null
    description: Null when the call errored.
  - name: metadata.requestId
    type: string (uuid)
    description: Per-request correlation id. Quote it in support requests.
  - name: metadata.creditsUsed
    type: number
    description: Credits actually charged by this call.
  - name: metadata.creditsRemaining
    type: number
    description: Credit balance after the call.
  source: >-
    openapi/leo-jobs-api-openapi.yml (JobPollEnvelopeDto, JobErrorItemDto);
    live observation of https://api.meetleo.com/v1/openapi.json -> 404
  observed: '2026-08-14'
gateway_envelope:
  shape: '{"message":"Not Found"}'
  note: >-
    Requests that never reach the application -- unmatched routes at the AWS API
    Gateway edge -- return a bare {"message":"..."} object with no requestId and no
    errors[] array. Clients must handle both shapes.
  observed: '2026-08-14'
