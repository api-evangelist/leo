aid: leo
name: LeO
description: >-
  LeO is an AI-powered sales and prospecting platform for commercial insurance
  professionals, serving property & casualty (P&C) brokers, employee benefits
  advisors, and nonprofit insurance specialists. The platform pairs a
  commercial-lines prospect database of 25M+ US businesses and 200+ filters --
  NAICS codes, revenue thresholds, workers' compensation, DOT/FMCSA records, OSHA
  compliance history, Form 5500 benefits and pension filings, and IRS 990
  nonprofit data -- with a renewal-date (X-date) database carrying key contacts
  and AI-predicted renewal months. LeO generates AI-personalized email outreach,
  produces pre-meeting intelligence on incumbent carriers, brokers, coverage and
  risk gaps, and pushes qualified prospects to CRM or CSV export. Founded by CEO
  Liri Halperin Segal, LeO is a Techstars portfolio company and has been certified
  HIPAA compliant by an external auditing firm. Alongside the subscription web
  application it ships two programmatic surfaces: a REST "Leo Public API" at
  api.meetleo.com with a published OpenAPI 3.0.0 definition covering account,
  credits, prospect search and asynchronous contact enrichment, and a first-party,
  OAuth-protected MCP Connector at mcp.meetleo.com marketed for Claude, ChatGPT,
  Gemini and Copilot. Both are entitlement-gated to existing customers and metered
  in credits.
