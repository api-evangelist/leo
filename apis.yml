- name: LeO MCP Connector
  description: >-
    First-party, hosted, remote MCP server exposing LeO's insurance intelligence --
    25M+ US businesses across 200+ filters, x-dates, Form 5500 financials, benefits
    red flags, DOT Intelligence, Trucking Triggers, IRS 990 data, OSHA violations
    and Talking Points -- to Claude, ChatGPT, Gemini, Copilot and custom agents.
    OAuth 2.1 (authorization_code + PKCE S256) over an AWS Cognito user pool, with
    RFC 9728 and RFC 8414 discovery documents published anonymously. Requires a LeO
    account and honours its entitlements and credit balance.
  humanURL: https://www.meetleo.com/mcp
