aid: leo
name: LeO
description: >-
  LeO is an AI-powered sales and prospecting platform for commercial insurance
  professionals, serving property & casualty (P&C) brokers, employee benefits
  advisors, and nonprofit insurance specialists. The platform pairs a
  commercial-lines prospect database with more than 150 filters -- NAICS codes,
  revenue thresholds, workers' compensation, DOT, OSHA compliance history and IRS
  990 nonprofit data -- with a renewal-date (X-date) database carrying key contacts
  and AI-predicted renewal months. LeO generates AI-personalized email outreach,
  produces pre-meeting intelligence on incumbent carriers, brokers, coverage and
  risk gaps, and pushes qualified prospects to CRM or CSV export. Founded by CEO
  Liri Halperin Segal, LeO is a Techstars portfolio company and has been certified
  HIPAA compliant by an external auditing firm. It is delivered as a subscription
  web application and publishes no public developer API, SDKs or documentation;
  its only machine-readable surfaces are an llms.txt and a live Wix-provided site
  MCP endpoint covering public marketing content.
