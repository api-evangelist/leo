notes: >-
  Derived from the 24 component schemas and the $ref edges between them in LeO's
  published OpenAPI. LeO publishes no object reference page, so there are no
  documented id prefixes; identifiers are a bare integer (prospectId) and a UUID
  (taskId). Nothing here is invented -- every entity, field and edge is present in
  the spec.
entity_count: 8
identifiers:
