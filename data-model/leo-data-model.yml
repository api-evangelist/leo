data_layers:
  note: >-
    LeO's own MCP page names eight data layers; six of them are visible as
    structured schema in this spec.
  layers:
  - name: Renewal dates (x-dates)
    schema: InsuranceLineData.renewalDate, XDatePredictions
  - name: Form 5500 financials
    schema: InsuranceLineData (pension, benefits) + benefits filters
  - name: Benefits red flags
    schema: BenefitsRedFlags (39 flags)
  - name: DOT Intelligence
    schema: DotData, DotInsuranceLine
  - name: 990 nonprofit financials
    schema: ProspectIrs990, ProspectIrs990HistoryEntry
  - name: OSHA violations
    schema: OshaData
  - name: Trucking Triggers
    schema: not modelled in the public spec
  - name: Talking Points
    schema: not modelled in the public spec
  gap: >-
    Trucking Triggers and Talking Points are advertised on
    https://www.meetleo.com/mcp but have no representation in the published REST
    contract, so they are either MCP-only capabilities or not yet public.
