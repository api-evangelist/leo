notes: >-
  LeO publishes a pricing page, but the prices are not in the page a machine can
  read. https://www.meetleo.com/pricing is a Wix pricing-plans widget: the served
  HTML contains only placeholder tokens ([PLAN TITLE], [PLAN DESCRIPTION], $0) and
  the real figures are injected client-side from a Wix paid-plans service. The
  service endpoints (/_api/paid-plans/v1/plans, /_api/paid-plans/v2/plans) return
  HTTP 403 "Pricing Plans instanceId not in context" to an anonymous caller, so no
  price could be read without executing the page. Tier NAMES, the feature matrix,
  the billing options and the trial terms ARE in the served HTML and are recorded
  verbatim below. Crucially, NOTHING on the pricing page mentions the API, the MCP
  Connector, credits-per-call, or which tier carries hasApiAccess / hasMcpAccess --
  so the commercial terms for the developer surface are unpublished.
