    field: plan.hasApiAccess
    operation: AccountController_getAccount
    source: openapi/leo-account-api-openapi.yml
  mcp_access_gate:
    field: plan.hasMcpAccess
    operation: AccountController_getAccount
    source: openapi/leo-account-api-openapi.yml
  consumption_model: credits
  credit_rules:
  - POST /v1/prospects/search consumes no enrichment credits.
  - GET /v1/prospects/{prospectId} consumes 1 credit.
  - POST /v1/prospects/enrich reserves up to maxProspects credits; only rows returning enrichmentStatus "enriched" are charged.
  source: openapi/_original/leo-openapi.json, https://www.meetleo.com/mcp
  gap: >-
    The spec states what CONSUMES a credit but never what a credit COSTS, and the
    pricing page never says how many credits a tier includes. A prospective API
    consumer cannot price an integration from public material.
