notes: >-
  LeO publishes NO numeric rate limits. Every credit-consuming operation declares
  a 429 response described verbatim as "Too many requests (HTTP API stage
  throttling or upstream limits)" -- which tells a client that throttling exists at
  the AWS API Gateway stage and upstream, but never says at what rate, over what
  window, or per what principal. No RateLimit-*, X-RateLimit-* or Retry-After
  header was observed on any live response, and none is declared in the spec, so an
  agent has no runtime signal at all: it learns it is over the limit only by being
  rejected, and cannot tell how long to wait. Recorded as an honest zero.
